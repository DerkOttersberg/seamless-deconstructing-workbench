name: Bug report
description: Report a reproducible workbench recipe, inventory, or compatibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options: [Fabric, Forge, NeoForge]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, mod, API, and loader versions
    validations:
      required: true
  - type: input
    id: recipe
    attributes:
      label: Input item and expected recipe output
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      render: shell
