plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}

architectury { minecraft = libs.versions.minecraft.get() }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = libs.versions.java.get().toInteger()
    }

    tasks.withType(JavaExec).configureEach { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger()) } }
    tasks.withType(Test).configureEach { useJUnitPlatform() }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${rootProject.archives_base_name}-${project.name}"
            }
        }
        repositories { mavenLocal() }
    }
}

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    inputs.files(fileTree('common/src') { include '**/*.java' })
    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        def violations = []
        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) violations << "${source}:${number}: ${line.trim()}"
            }
        }
        if (!violations.isEmpty()) throw new GradleException("Loader imports found in common:\n${violations.join('\n')}")
    }
}

def loaderJarFiles = ['fabric', 'forge'].collectEntries { loader ->
    [(loader): providers.provider { project(":${loader}").tasks.named('remapJar').get().archiveFile.get() }]
}

tasks.register('verifyLoaderJars') {
    group = 'verification'
    dependsOn ':fabric:remapJar', ':forge:remapJar'
    inputs.files(loaderJarFiles.values())
    doLast {
        def specifications = [
            fabric: [expected: 'fabric.mod.json', forbidden: ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']],
            forge: [expected: 'META-INF/mods.toml', forbidden: ['fabric.mod.json', 'META-INF/neoforge.mods.toml']]
        ]
        specifications.each { loader, specification ->
            def archive = loaderJarFiles[loader].get().asFile
            def expectedName = "${rootProject.archives_base_name}-${project.version}-${loader}.jar"
            if (archive.name != expectedName) throw new GradleException("Expected ${expectedName}, found ${archive.name}")
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                    new DataInputStream(zip.getInputStream(entry)).withCloseable { header ->
                        if (header.readInt() != -889275714) throw new GradleException("Invalid class: ${entry.name}")
                        header.readUnsignedShort()
                        if (header.readUnsignedShort() > 61) throw new GradleException("Not Java 17 compatible: ${entry.name}")
                    }
                }
                if (zip.getEntry(specification.expected) == null) throw new GradleException("${archive.name} is missing ${specification.expected}")
                specification.forbidden.each { entry ->
                    if (zip.getEntry(entry) != null) throw new GradleException("${archive.name} contains stale metadata ${entry}")
                }
                if (zip.getEntry('com/seamlessdeconstructor/SeamlessDeconstructorMod.class') == null) throw new GradleException("${archive.name} is missing common code")
                if (zip.getEntry('com/derko/seamlessapi/DeconstructionAPI.class') != null) throw new GradleException("${archive.name} improperly shades Seamless API")
                if (zip.entries().find { it.name.contains('/gametest/') }) throw new GradleException("${archive.name} ships development GameTest classes")
                if (loader == 'fabric') {
                    def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
                    if (metadata.id != 'seamlessdeconstructor' || metadata.schemaVersion != 1) throw new GradleException('Unexpected Fabric mod identity/schema')
                    if (metadata.version != project.version.toString()) throw new GradleException("Unexpected Fabric version ${metadata.version}")
                    if (metadata.license != 'MIT') throw new GradleException("Unexpected Fabric license ${metadata.license}")
                    if (metadata.depends.fabricloader != '>=0.19.5') throw new GradleException("Unexpected Fabric Loader range ${metadata.depends.fabricloader}")
                    if (metadata.depends['fabric-api'] != libs.versions.fabric.api.range.get()) throw new GradleException("Unexpected Fabric API range ${metadata.depends['fabric-api']}")
                    if (metadata.depends.values().any { it == '*' }) throw new GradleException('Fabric dependency wildcards are forbidden')
                    if (metadata.depends.minecraft != '1.20.1' || metadata.depends.java != '>=17') throw new GradleException('Unexpected Minecraft/Java range')
                    if (metadata.depends.seamlessapi != '>=2.0.0 <3.0.0') throw new GradleException("Unexpected Seamless API range ${metadata.depends.seamlessapi}")
                } else {
                    def metadata = zip.getInputStream(zip.getEntry(specification.expected)).getText('UTF-8')
                    if (metadata.contains('${')) throw new GradleException("${archive.name} contains unprocessed metadata placeholders")
                    def requiredValues = loader == 'forge'
                            ? ['modLoader="javafml"', 'loaderVersion="[47,)"', 'license="MIT"',
                               "version=\"${project.version}\"", 'modId="forge"', 'versionRange="[47.1,48)"',
                               'modId="minecraft"', 'versionRange="[1.20.1,1.20.2)"',
                               'modId="seamlessapi"', 'versionRange="[2.0.0,3.0.0)"', 'javaVersion="[17,)"']
                            : ['license="MIT"', "version=\"${project.version}\"",
                               'modId="neoforge"', 'versionRange="[26.3.0.48-beta,26.4)"',
                               'modId="minecraft"', 'versionRange="[1.20.1,1.20.2)"',
                               'modId="seamlessapi"', 'versionRange="[2.0.0,3.0.0)"', 'javaVersion="[17,)"']
                    requiredValues.each { value ->
                        if (!metadata.contains(value)) throw new GradleException("${archive.name} is missing processed metadata: ${value}")
                    }
                }
            }
        }
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') {
    dependsOn tasks.named('verifyCommonIsolation')
    dependsOn tasks.named('verifyLoaderJars')
    dependsOn subprojects.collect { it.tasks.named('check') }
}
