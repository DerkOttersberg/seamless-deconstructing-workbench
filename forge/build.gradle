plugins { id 'dev.architectury.loom-no-remap' }
base { archivesName = rootProject.archives_base_name }

// Forge 26.2 places ordinary classpath jars in its cleaned bootstrap layer.
// Compile the shared sources into the loader output so common and entrypoint
// classes live in the same transformed module during both development and use.
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

// Loom 1.17 still adds its legacy mapped-development naming service to Forge's
// 26.2 no-remap runtime. It shadows Forge's native naming service, then fails
// because an unobfuscated Minecraft release correctly has no mappings file.
configurations.forgeRuntimeLibrary {
    exclude group: 'dev.architectury', module: 'architectury-naming-service'
    exclude group: 'dev.architectury', module: 'architectury-mixin-remapper-service'
}

dependencies {
    minecraft libs.minecraft
    forge libs.forge
    def seamlessApiForge = files(rootProject.file("../Seamless-API/forge/build/libs/seamless-api-${libs.versions.seamless.api.get()}-forge.jar"))
    seamlessApiForge.builtBy gradle.includedBuild('Seamless-API').task(':forge:jar')
    implementation seamlessApiForge
}
loom { mods { seamlessdeconstructor { sourceSet sourceSets.main } } }
def metadataProperties = [mod_version: project.version.toString(), loader_version_range: '[65,)', forge_version_range: '[65.1.3,66)', minecraft_version_range: '[26.2,26.3)']
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') { expand metadataProperties }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest { attributes 'Automatic-Module-Name': 'io.github.derkottersberg.seamlessdeconstructor' }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar"
}
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}
