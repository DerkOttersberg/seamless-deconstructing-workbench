plugins { id 'dev.architectury.loom-no-remap' }
base { archivesName = rootProject.archives_base_name }

// Forge 26.2 places ordinary classpath jars in its cleaned bootstrap layer.
// Compile the shared sources into the loader output so common and entrypoint
// classes live in the same transformed module during both development and use.
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDirs = ['src/gametest/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft libs.minecraft
    forge libs.forge
    def seamlessApiForge = files(rootProject.file("../seamless-api/forge/build/libs/seamless-api-${libs.versions.seamless.api.get()}-forge.jar"))
    seamlessApiForge.builtBy gradle.includedBuild('seamless-api').task(':forge:jar')
    implementation seamlessApiForge
}
def gameTestMappings = file('identity-mappings.tiny')
loom {
    mods {
        seamlessdeconstructor {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            runDir 'build/gametest'
            property 'forge.enabledGameTestNamespaces', 'seamlessdeconstructor'
            // Forge 65's Loom launch template omits these properties. The
            // 26.2 release is unobfuscated, so an identity map is sufficient.
            property 'architectury.naming.mappingsPath', gameTestMappings.absolutePath
            property 'architectury.naming.sourceNamespace', 'official'
            property 'architectury.mixinRemapper.mappingsPath', gameTestMappings.absolutePath
            property 'architectury.mixinRemapper.sourceNamespace', 'official'
        }
    }
}

tasks.named('runGameTestServer') {
    inputs.file(gameTestMappings)
    doLast {
        def latestLog = file('build/gametest/logs/latest.log')
        if (!latestLog.isFile()) {
            throw new GradleException("Forge GameTest run produced no latest.log")
        }
        def matcher = latestLog.getText('UTF-8') =~ /All (\d+) required tests passed/
        if (!matcher.find() || matcher.group(1).toInteger() < 9) {
            throw new GradleException(
                    "Forge GameTest discovery guard expected eight Workbench tests plus the built-in test")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
def metadataProperties = [mod_version: project.version.toString(), loader_version_range: '[65,)', forge_version_range: '[65.1.3,66)', minecraft_version_range: '[26.2,26.3)']
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') { expand metadataProperties }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest { attributes 'Automatic-Module-Name': 'io.github.derkottersberg.seamlessdeconstructor' }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar"
}
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}
