plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }

// Forge 26.3 places ordinary classpath jars in its cleaned bootstrap layer.
// Compile the shared sources into the loader output so common and entrypoint
// classes live in the same transformed module during both development and use.
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDirs = ['src/gametest/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

apply from: rootProject.file('gradle/empty-gametest-structure.gradle')

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// All 26.3 classes already use official names. Legacy remapping services
// create a second bootstrap-layer copy of event-bus parameter types.


dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    forge libs.forge
    def seamlessApiForge = files(rootProject.file("../seamless-api/forge/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-forge-dev.jar"))
    seamlessApiForge.builtBy gradle.includedBuild('seamless-api').task(':forge:jar')
    implementation seamlessApiForge
}
def gameTestModRoot = layout.buildDirectory.dir('gametest-mod')
loom {
    mods {
        seamlessdeconstructor {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            environmentVariable 'MOD_CLASSES', "seamlessdeconstructor%%${gameTestModRoot.get().asFile.absolutePath}"
            runDir 'build/gametest'
            property 'forge.enabledGameTestNamespaces', 'seamlessdeconstructor'
        }
    }
}

// Forge's classpath locator treats Loom's main and test source-set unions as
// duplicate mods and can select the main-only union. Stage one test-only mod
// root so test callbacks share the transformed game/event-bus classloader.
def stageGameTestMod = tasks.register('stageGameTestMod', Sync) {
    dependsOn tasks.named('classes'), tasks.named('gametestClasses')
    from sourceSets.main.output
    from sourceSets.gametest.output
    into gameTestModRoot
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('runGameTestServer') {
    dependsOn stageGameTestMod
    // MOD_CLASSES is set on the run configuration above: Loom replaces JavaExec
    // environment values during execution. Exclude the old source roots here too.
    def sourceRoots = (sourceSets.main.output.files + sourceSets.gametest.output.files) as Set
    classpath = files(gameTestModRoot) + classpath.filter { !sourceRoots.contains(it) }
    doLast {
        def latestLog = file('build/gametest/logs/latest.log')
        if (!latestLog.isFile()) {
            throw new GradleException("Forge GameTest run produced no latest.log")
        }
        def matcher = latestLog.getText('UTF-8') =~ /All (\d+) required tests passed/
        if (!matcher.find() || matcher.group(1).toInteger() != 8) {
            throw new GradleException(
                    "Forge GameTest discovery guard expected eight Workbench tests")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
def metadataProperties = [mod_version: project.version.toString(), loader_version_range: '[52,)', forge_version_range: '[52.1.16,53)', minecraft_version_range: '[1.21.1]']
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') { expand metadataProperties }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest { attributes 'Automatic-Module-Name': 'io.github.derkottersberg.seamlessdeconstructor' }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-dev.jar"
}
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}
tasks.named('remapJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar" }

tasks.named('remapSourcesJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar" }
